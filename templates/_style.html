<style>
/* ==========================================================================
   Warden Trade - design system
   static/css/design.css - no JS, class names unchanged from phase 1.

   Principles
   1. Color carries meaning. The UI itself is neutral; green, red and amber
      appear only on data and states.
   2. Structure comes from hairlines and spacing, not from boxes. The only
      boxed element is the portfolio summary (.cards).
   3. Numbers are the content: tabular figures, right-aligned, one family.
   4. No decoration: no gradients, glows, blur, hover-lift or tracked caps.
   ========================================================================== */

/* --------------------------------------------------------------------------
   1. Font (self-hosted, SIL OFL - see static/fonts/IBM-Plex-Sans-OFL.txt)
   Variable weight 100-700, latin subset. Digits are tabular by default.
   -------------------------------------------------------------------------- */
@font-face {
  font-family: "IBM Plex Sans";
  font-style: normal;
  font-weight: 100 700;
  font-display: swap;
  src: url("/static/fonts/ibm-plex-sans-latin-wght-normal.woff2") format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
    U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
    U+2212, U+2215, U+FEFF, U+FFFD;
}

/* --------------------------------------------------------------------------
   2. Design tokens
   Required set kept: background, surface, text, muted, accent, border, danger.
   -------------------------------------------------------------------------- */
:root {
  color-scheme: dark;

  /* Neutrals (graphite, steps of roughly 5% lightness) */
  --background: #0e1012;
  --bg-soft: #121417;
  --surface: #16191d;
  --surface-2: #1c2025;
  --surface-3: #242830;

  /* Text */
  --text: #e6e8eb;
  --text-strong: #f5f6f7;
  --muted: #8d96a1;
  --muted-soft: #6a727d; /* decorative / disabled only, below 4.5:1 */

  /* Accent: the interface is neutral, so the accent is the text color.
     Primary actions are light-on-dark; focus rings use the same value. */
  --accent: #e6e8eb;
  --accent-hover: #ffffff;
  --accent-active: #cdd1d6;
  --accent-ink: #0e1012;
  --accent-glow: rgba(230, 232, 235, 0.12);

  /* Hairlines */
  --border: #272c33;
  --border-soft: #1e2227;
  --border-strong: #363d47;

  /* Semantic: reserved for data and state */
  --danger: #ec5f6a;
  --danger-text: #ff8089;
  --danger-bg: rgba(236, 95, 106, 0.1);
  --danger-border: rgba(236, 95, 106, 0.35);
  --success: #4fbf86;
  --success-bg: rgba(79, 191, 134, 0.1);
  --success-border: rgba(79, 191, 134, 0.35);
  --warning: #dea23a;
  --warning-bg: rgba(222, 162, 58, 0.1);
  --warning-border: rgba(222, 162, 58, 0.35);
  --info: #6aaef0;
  --info-bg: rgba(106, 174, 240, 0.1);
  --info-border: rgba(106, 174, 240, 0.35);

  /* Aliases (compat) */
  --bg: var(--background);
  --fg: var(--text);

  /* Shape: three radii with different jobs */
  --radius-sm: 5px; /* badges, tags */
  --radius-md: 8px; /* controls */
  --radius-lg: 12px; /* panels */
  --radius-pill: 999px;

  /* Depth: elevation is expressed with borders, not shadows */
  --shadow-sm: none;
  --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.4);
  --shadow-glow: none;

  /* Type */
  --font-sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto,
    "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
  --fs-xs: 0.75rem; /* 12 */
  --fs-sm: 0.8125rem; /* 13 */
  --fs-md: 0.9375rem; /* 15 */
  --fs-lg: 1.125rem; /* 18 */
  --fs-xl: 1.5rem; /* 24 */
  --fs-2xl: 1.5rem; /* kept for compat, headings stay calm */
  --fs-metric: 2.75rem;
  --fs-metric-sm: 1.5rem;

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;

  /* Layout */
  --container-max: 1120px;
  --nav-height: 56px;
}

/* --------------------------------------------------------------------------
   3. Base
   -------------------------------------------------------------------------- */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

/* Author display rules (flex, grid) would otherwise override [hidden]. */
[hidden] {
  display: none !important;
}

html {
  -webkit-text-size-adjust: 100%;
  scrollbar-color: var(--border-strong) transparent;
}

body {
  min-height: 100vh;
  background: var(--background);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: var(--fs-md);
  line-height: 1.55;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

img,
svg,
video {
  display: block;
  max-width: 100%;
  height: auto;
}

a {
  color: var(--text-strong);
  text-decoration: underline;
  text-decoration-color: var(--border-strong);
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
  transition: text-decoration-color 0.12s ease;
}

a:hover {
  text-decoration-color: var(--accent);
}

h1,
h2,
h3,
h4 {
  color: var(--text-strong);
  line-height: 1.25;
  font-weight: 600;
}

h1 {
  font-size: var(--fs-xl);
  letter-spacing: -0.015em;
}
h2 {
  font-size: var(--fs-lg);
  letter-spacing: -0.01em;
}
h3 {
  font-size: var(--fs-md);
}
h4 {
  font-size: var(--fs-sm);
}

p {
  max-width: 68ch;
  margin-bottom: var(--space-3);
}

small,
.muted {
  color: var(--muted);
  font-size: var(--fs-sm);
}

ul,
ol {
  padding-left: 1.25rem;
}

code,
pre {
  font-family: var(--font-mono);
  font-size: 0.9em;
}

pre {
  background: var(--bg-soft);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: var(--space-4);
  overflow-x: auto;
}

::selection {
  background: var(--accent);
  color: var(--accent-ink);
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

/* --------------------------------------------------------------------------
   4. Layout
   -------------------------------------------------------------------------- */
.container {
  width: 100%;
  max-width: var(--container-max);
  margin-inline: auto;
  padding-inline: var(--space-5);
}

.page {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.main {
  flex: 1;
  padding-block: var(--space-6) var(--space-7);
}

.section {
  margin-bottom: var(--space-6);
}

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: var(--space-4);
  margin-bottom: var(--space-5);
}

.section-head h1 {
  margin-bottom: var(--space-1);
}

.section-head p {
  color: var(--muted);
  font-size: var(--fs-sm);
  margin: 0;
}

/* --------------------------------------------------------------------------
   5. App shell
   Sidebar (workspace nav + live watchlist) | tab strip, content panel, status
   bar. The shell fills the viewport and the panel body scrolls inside it, so
   navigation and status stay in place. Under 900px it becomes a compact top
   strip and the page scrolls normally.
   -------------------------------------------------------------------------- */
:root {
  --side-w: 248px;
}

body.app {
  height: 100dvh;
  overflow: hidden;
}

.shell {
  display: grid;
  grid-template-columns: var(--side-w) minmax(0, 1fr);
  gap: var(--space-3);
  height: 100dvh;
  padding: var(--space-3);
}

/* Brand mark: a ring with a dot. The warden keeps watch. */
.brand-mark,
.nav-brand-mark {
  position: relative;
  width: 18px;
  height: 18px;
  flex-shrink: 0;
  border: 2px solid var(--text-strong);
  border-radius: 50%;
}

.brand-mark::after,
.nav-brand-mark::after {
  content: "";
  position: absolute;
  inset: 3px;
  border-radius: 50%;
  background: var(--text-strong);
}

/* --- Sidebar ------------------------------------------------------------ */
.side {
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding: var(--space-3);
  overflow-y: auto;
  background: var(--bg-soft);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
}

.side-head {
  padding: 6px var(--space-2) var(--space-3);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--text-strong);
  font-size: var(--fs-md);
  font-weight: 600;
  letter-spacing: -0.01em;
  text-decoration: none;
  white-space: nowrap;
}

.side-label {
  margin: 0;
  padding: var(--space-4) var(--space-2) 6px;
  color: var(--muted);
  font-size: var(--fs-sm);
  font-weight: 500;
}

.side-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.side-link {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 8px 10px;
  background: none;
  border: 0;
  border-radius: var(--radius-md);
  color: var(--text);
  font: inherit;
  font-size: var(--fs-sm);
  font-weight: 500;
  text-align: left;
  text-decoration: none;
  cursor: pointer;
  transition: background 0.12s ease, color 0.12s ease;
}

.side-link svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.75;
  stroke-linecap: round;
  stroke-linejoin: round;
  color: var(--muted);
}

.side-link:hover {
  background: var(--surface);
}

.side-link[aria-current="page"] {
  background: var(--surface-2);
  color: var(--text-strong);
  box-shadow: inset 0 0 0 1px var(--border);
}

.side-link[aria-current="page"] svg {
  color: var(--text-strong);
}

.side-link:focus-visible {
  outline-offset: -2px;
}

/* Watchlist row: symbol left, live price right */
.side-link.watch {
  justify-content: space-between;
  gap: var(--space-2);
}

.watch-sym {
  color: var(--muted);
}

.watch-px {
  color: var(--text-strong);
}

.side-foot {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin-top: auto;
  padding-top: var(--space-3);
  border-top: 1px solid var(--border-soft);
}

.side-watch {
  margin-bottom: var(--space-3);
}

/* --- Workspace ---------------------------------------------------------- */
.workspace {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  min-width: 0;
  min-height: 0;
}

.topbar {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  min-height: 36px;
  padding-inline: 2px;
}

.view-tabs {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  min-width: 0;
}

.view-tab {
  display: inline-flex;
  align-items: center;
  padding: 6px var(--space-3);
  background: var(--surface-2);
  border-radius: var(--radius-md);
  box-shadow: inset 0 0 0 1px var(--border);
  color: var(--text-strong);
  font-size: var(--fs-sm);
  font-weight: 500;
  white-space: nowrap;
}

/* In-page jump links (plain links: there is no scroll-spy, so no fake "active") */
.jump {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  overflow-x: auto;
}

.jump a {
  padding: 6px 10px;
  border-radius: var(--radius-md);
  color: var(--muted);
  font-size: var(--fs-sm);
  font-weight: 500;
  text-decoration: none;
  white-space: nowrap;
  transition: color 0.12s ease, background 0.12s ease;
}

.jump a:hover {
  background: var(--surface);
  color: var(--text-strong);
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  margin-left: auto;
}

.panel {
  display: flex;
  flex: 1;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
  background: var(--background);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg);
}

.view {
  display: flex;
  flex: 1;
  flex-direction: column;
  min-height: 0;
}

.panel-bar {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: var(--space-1) var(--space-3);
  padding: 11px var(--space-4);
  border-bottom: 1px solid var(--border-soft);
  font-size: var(--fs-sm);
}

.panel-title {
  color: var(--text-strong);
  font-size: var(--fs-sm);
  font-weight: 600;
  letter-spacing: 0;
}

.panel-body {
  flex: 1;
  min-height: 0;
  padding: var(--space-5) var(--space-5) var(--space-6);
  overflow-y: auto;
  scroll-behavior: smooth;
  scroll-padding-top: var(--space-4);
}

.panel-body > * {
  max-width: var(--container-max);
}

#account .section {
  max-width: 520px;
}

/* --- Status bar --------------------------------------------------------- */
.statusbar {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  min-height: 26px;
  padding-inline: var(--space-2);
  color: var(--muted);
  font-size: var(--fs-xs);
}

.st {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.st-end {
  margin-left: auto;
}

.st-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--muted-soft);
}

.st-live .st-dot {
  background: var(--success);
  animation: live-pulse 2.4s ease-in-out infinite;
}

.st-stale .st-dot {
  background: var(--warning);
}

.st-off .st-dot {
  background: var(--danger);
}

/* --- Dashboard blocks --------------------------------------------------- */
.split {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0 var(--space-6);
}

.feed {
  margin: 0;
  padding: 0;
  list-style: none;
  border-top: 1px solid var(--border);
}

.feed li {
  padding: 10px 0;
  border-bottom: 1px solid var(--border-soft);
  font-size: var(--fs-sm);
  overflow-wrap: anywhere;
}

/* Cards that are not part of the summary grid (wallet): free-standing */
.cards.cards-flex {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3);
  background: none;
  border: 0;
  border-radius: 0;
  overflow: visible;
}

.cards-flex > .card {
  flex: 1 1 200px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
}

.card-label {
  margin-bottom: 10px;
  color: var(--muted);
  font-size: var(--fs-sm);
  font-weight: 500;
}

/* --------------------------------------------------------------------------
   6. Summary panel (.cards)
   One bordered panel divided by hairlines, not six floating cards.
   The .card-accent cell is the hero and takes the full first row; the other
   cells share the rows below (5 columns on desktop, 2 on tablet and phone).
   If the number of cells changes, adjust the column counts below.
   -------------------------------------------------------------------------- */
.cards {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}

.cards > .card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 20px var(--space-5) 18px;
  background: var(--surface);
  border: 0;
  border-radius: 0;
}

.cards > .card-accent {
  grid-column: 1 / -1;
  order: -1;
  padding-block: 28px 24px;
  background: var(--surface-2);
}

/* Standalone card (outside .cards) */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
}

.card-eyebrow {
  margin-bottom: 10px;
  color: var(--muted);
  font-size: var(--fs-sm);
  font-weight: 500;
}

.card-title {
  margin-bottom: var(--space-2);
  color: var(--text-strong);
  font-size: var(--fs-lg);
  font-weight: 600;
}

.card-text {
  margin-bottom: var(--space-4);
  color: var(--muted);
  font-size: var(--fs-sm);
}

.card-metric {
  color: var(--text-strong);
  font-size: var(--fs-metric-sm);
  font-weight: 500;
  line-height: 1.15;
  letter-spacing: -0.015em;
  overflow-wrap: anywhere;
}

.card-accent .card-metric {
  font-size: var(--fs-metric);
  font-weight: 400;
  letter-spacing: -0.03em;
}

/* PnL coloring: green when up, red when down (dashboard deltas). */
.card-metric.up {
  color: var(--success);
}
.card-metric.down {
  color: var(--danger-text);
}
.table td.up {
  color: var(--success);
}
.table td.down {
  color: var(--danger-text);
}

.card-metric-delta {
  font-size: var(--fs-sm);
  font-weight: 500;
}

.card-metric-delta.up {
  color: var(--success);
}
.card-metric-delta.down {
  color: var(--danger-text);
}

.card-footer {
  margin-top: auto;
  padding-top: var(--space-3);
  color: var(--muted);
  font-size: var(--fs-sm);
}

.card-accent .card-footer {
  margin-top: 0;
  padding-top: var(--space-2);
}

/* --------------------------------------------------------------------------
   7. Tables
   Ledger style: hairlines only, no panel. Numbers right-aligned (.num).
   -------------------------------------------------------------------------- */
.table-wrap {
  overflow-x: auto;
}

table.table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--fs-md);
}

.table caption {
  caption-side: top;
  padding-bottom: var(--space-3);
  text-align: left;
  color: var(--muted);
  font-size: var(--fs-sm);
  font-weight: 500;
}

.table thead th {
  padding: 10px var(--space-4);
  border-bottom: 1px solid var(--border-strong);
  text-align: left;
  color: var(--muted);
  font-size: var(--fs-sm);
  font-weight: 500;
  white-space: nowrap;
}

.table tbody td {
  padding: 13px var(--space-4);
  border-bottom: 1px solid var(--border-soft);
  vertical-align: middle;
}

/* Row headers (e.g. Account profile): UA stylesheets center `th`
   by default — keep them left like every other cell. */
.table tbody th {
  padding: 13px var(--space-4);
  border-bottom: 1px solid var(--border-soft);
  text-align: left;
  vertical-align: middle;
  font-weight: 500;
}

.table th:first-child,
.table td:first-child {
  padding-left: 0;
}

.table th:last-child,
.table td:last-child {
  padding-right: 0;
}

.table td.num,
.table th.num {
  text-align: right;
}

.table td.pos {
  color: var(--success);
}
.table td.neg {
  color: var(--danger-text);
}

/* Footnote right after a table */
.table + .muted,
.table-wrap + .muted {
  display: block;
  margin-top: var(--space-3);
}

/* Identifier columns (UUIDs): keep the prefix, drop the rest */
.table td.muted:first-child {
  max-width: 8.5rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* --------------------------------------------------------------------------
   11. Strategy lab form: segmented product picker, window inputs with
   preset chips, action row. No native dropdowns: every option stays
   visible and one tap away.
   -------------------------------------------------------------------------- */
.lab-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-4);
  align-items: flex-end;
  margin: 0 0 var(--space-4);
  padding: 0;
  border: 0;
}

.lab-row > legend {
  padding: 0;
  margin-bottom: 6px;
  color: var(--text);
  font-size: var(--fs-sm);
  font-weight: 500;
}

.field.lab-num {
  flex: 0 1 9rem;
  min-width: 6.5rem;
  margin-bottom: 0;
}

.seg {
  display: inline-flex;
  flex-wrap: wrap;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  overflow: hidden;
}

.seg-opt {
  position: relative;
  cursor: pointer;
}

.seg-opt input {
  position: absolute;
  opacity: 0;
  inset: 0;
  margin: 0;
  cursor: pointer;
}

.seg-opt span {
  display: inline-flex;
  align-items: center;
  min-height: 2.25rem;
  padding: 0 var(--space-4);
  border-right: 1px solid var(--border-strong);
  color: var(--muted);
  font-size: var(--fs-sm);
  font-weight: 500;
  white-space: nowrap;
}

.seg-opt:last-child span {
  border-right: 0;
}

.seg-opt input:checked + span {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
  font-weight: 600;
}

.seg-opt input:focus-visible + span {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
}

.lab-presets {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-3);
  min-height: 2.25rem;
  padding-bottom: 1px;
  font-size: var(--fs-sm);
}

.chip {
  display: inline-flex;
  align-items: center;
  min-height: 2.25rem;
  padding: 0 var(--space-3);
  background: transparent;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  color: var(--text);
  font-family: inherit;
  font-size: var(--fs-sm);
  cursor: pointer;
}

.chip:hover {
  background: var(--surface-2);
